
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>共有ログイン管理</title>
<style>
:root {
  font-family: system-ui, sans-serif;
  color: #252638;
  background: #f4f5fb;
}
* { box-sizing: border-box; }
body { margin: 0; padding: 20px 14px 40px; }
main { max-width: 760px; margin: auto; }
h1 { font-size: 25px; margin-bottom: 6px; }
.sub { color: #73768a; font-size: 14px; }
.panel {
  background: white;
  border: 1px solid #e5e7f0;
  border-radius: 16px;
  padding: 18px;
  margin-top: 16px;
  box-shadow: 0 4px 18px #24264a08;
}
label { display: block; font-size: 14px; margin-bottom: 8px; }
select, button {
  font: inherit;
  border-radius: 10px;
  padding: 11px 13px;
}
select {
  width: 100%;
  border: 1px solid #d9dbea;
  background: white;
}
.members {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(190px,1fr));
  gap: 12px;
  margin-top: 14px;
}
.member {
  background: white;
  border: 1px solid #e5e7f0;
  border-radius: 15px;
  padding: 16px;
  min-width: 0;
}
.member h2 { font-size: 19px; margin: 0 0 10px; }
.status { font-size: 13px; margin: 10px 0; color: #666a7b; }
.status strong { color: #33364b; }
button {
  border: 0;
  cursor: pointer;
  font-weight: 650;
  width: 100%;
  margin-top: 8px;
  background: #ededf5;
  color: #34364d;
}
button.primary { background: #5655dc; color: white; }
button.danger { background: #fff0f0; color: #b33143; }
button:disabled { opacity: .45; cursor: not-allowed; }
.small { font-size: 12px; color: #777b8d; }
#connection { font-size: 13px; margin-top: 10px; }
#activity { padding-left: 20px; }
#activity li { margin: 8px 0; font-size: 13px; overflow-wrap: anywhere; }
.empty { color: #85889a; font-size: 14px; }
footer { margin-top: 24px; text-align: center; color: #898b9b; font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>共有ログイン管理</h1>
  <div class="sub">みんなの使用状況をリアルタイムで共有</div>

  <section class="panel">
    <label for="myName">自分の名前</label>
    <select id="myName">
      <option value="なーな">なーな</option>
      <option value="らび">らび</option>
      <option value="みかてぃ">みかてぃ</option>
    </select>
    <div id="connection">Firebaseに接続しています…</div>
  </section>

  <section>
    <div class="members" id="members"></div>
  </section>

  <section class="panel">
    <h2>最近の履歴</h2>
    <ol id="activity"><li class="empty">履歴を読み込み中…</li></ol>
    <button id="clearHistory" class="danger">履歴を全消去</button>
  </section>

  <section class="panel">
    <h2>使い方</h2>
    <p class="small">
      ・使いたいときは「使いたい！」を押してください。<br>
      ・実際に使用を始めるときは「使用開始」を押してください。<br>
      ・使い終わったら「使用終了」を押してください。<br>
      ・名前を選択して、自分が誰なのか設定してください。
    </p>
  </section>

  <footer>共有ログイン管理</footer>
</main>

<script type="module">
import { initializeApp } from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase, ref, onValue, set, update, get
} from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

import {
  getAuth, signInAnonymously
} from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// Firebase設定：3人とも入力する必要はありません
const firebaseConfig = {
  apiKey: "AIzaSyAVqgTP7iGm703wuDmL66E8PUvHVdd3Gxc",
  authDomain: "kyouyuu-account.firebaseapp.com",
  databaseURL: "https://kyouyuu-account-default-rtdb.firebaseio.com",
  projectId: "kyouyuu-account",
  storageBucket: "kyouyuu-account.firebasestorage.app",
  messagingSenderId: "946109825848",
  appId: "1:946109825848:web:e330913a022502beb1f7cd",
  measurementId: "G-QY99E3QLYX"
};

const names = ["なーな", "らび", "みかてぃ"];
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

const statusRef = ref(db, "sharedGameAccount/status");
const connectionEl = document.getElementById("connection");
const myNameEl = document.getElementById("myName");
const membersEl = document.getElementById("members");
const activityEl = document.getElementById("activity");

let data = {
  users: {},
  activity: []
};
let ready = false;
let busy = false;

for (const name of names) {
  data.users[name] = {
    request: false,
    using: false
  };
}

function safeText(value) {
  return String(value ?? "");
}

function showTime(value) {
  if (!value) return "";
  return new Date(value).toLocaleString("ja-JP", {
    month: "numeric",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit"
  });
}

function render() {
  membersEl.innerHTML = "";

  for (const name of names) {
    const user = data.users?.[name] || {};
    const card = document.createElement("article");
    card.className = "member";

    const heading = document.createElement("h2");
    heading.textContent = name;
    card.appendChild(heading);

    const status = document.createElement("div");
    status.className = "status";

    if (user.using) {
      status.textContent = "🟢 使用中";
    } else if (user.request) {
      status.textContent = "🟡 使用希望あり";
    } else {
      status.textContent = "⚪ 使用していません";
    }
    card.appendChild(status);

    const requestButton = document.createElement("button");
    requestButton.textContent = user.request ? "使用希望を取り消す" : "使いたい！";
    requestButton.disabled = !ready || busy || user.using;
    requestButton.addEventListener("click", () => {
      changeUser(name, {
        request: !user.request
      }, user.request ? "使用希望を取り消しました" : "使用を希望しました");
    });
    card.appendChild(requestButton);

    const startButton = document.createElement("button");
    startButton.className = "primary";
    startButton.textContent = "使用開始";
    startButton.disabled = !ready || busy || user.using ||
      !!data.activeUser;
    startButton.addEventListener("click", () => {
      startUsing(name);
    });
    card.appendChild(startButton);

    const endButton = document.createElement("button");
    endButton.className = "danger";
    endButton.textContent = "使用終了";
    endButton.disabled = !ready || busy ||
      !user.using || data.activeUser !== name;
    endButton.addEventListener("click", () => {
      endUsing(name);
    });
    card.appendChild(endButton);

    if (user.using && user.startedAt) {
      const since = document.createElement("div");
      since.className = "small";
      since.style.marginTop = "10px";
      since.textContent = "開始：" + showTime(user.startedAt);
      card.appendChild(since);
    }

    membersEl.appendChild(card);
  }

  activityEl.innerHTML = "";
  const history = Array.isArray(data.activity)
    ? data.activity.slice(0, 20)
    : [];

  if (history.length === 0) {
    const li = document.createElement("li");
    li.className = "empty";
    li.textContent = "まだ履歴はありません";
    activityEl.appendChild(li);
  } else {
    for (const item of history) {
      const li = document.createElement("li");
      li.textContent =
        showTime(item.time) + "　" +
        safeText(item.name) + "： " + safeText(item.message);
      activityEl.appendChild(li);
    }
  }
}

async function addActivity(name, message) {
  const history = Array.isArray(data.activity)
    ? [...data.activity]
    : [];

  history.unshift({
    name,
    message,
    time: Date.now()
  });

  await update(statusRef, {
    activity: history.slice(0, 20)
  });
}

async function changeUser(name, changes, message) {
  if (!ready || busy) return;
  busy = true;
  render();

  try {
    const snapshot = await get(statusRef);
    const current = snapshot.val() || {};
    const users = current.users || {};
    const user = users[name] || {};

    await update(ref(db, "sharedGameAccount/status/users/" + name), changes);
    await addActivity(name, message);
  } catch (error) {
    alert("更新できませんでした。通信状況を確認してください。");
    console.error(error);
  } finally {
    busy = false;
    render();
  }
}

async function startUsing(name) {
  if (!ready || busy) return;
  busy = true;
  render();

  try {
    const snapshot = await get(statusRef);
    const current = snapshot.val() || {};
    const users = current.users || {};
    const activeUser = current.activeUser || null;

    if (activeUser) {
      alert("現在 " + activeUser + " が使用中です。");
      return;
    }

    await update(statusRef, {
      activeUser: name,
      ["users/" + name + "/using"]: true,
      ["users/" + name + "/request"]: false,
      ["users/" + name + "/startedAt"]: Date.now()
    });

    await addActivity(name, "使用を開始しました");
  } catch (error) {
    alert("使用開始に失敗しました。もう一度試してください。");
    console.error(error);
  } finally {
    busy = false;
    render();
  }
}

async function endUsing(name) {
  if (!ready || busy) return;
  busy = true;
  render();

  try {
    const snapshot = await get(statusRef);
    const current = snapshot.val() || {};

    if (current.activeUser !== name) {
      alert("使用状況が更新されています。画面を確認してください。");
      return;
    }

    await update(statusRef, {
      activeUser: null,
      ["users/" + name + "/using"]: false,
      ["users/" + name + "/startedAt"]: null
    });

    await addActivity(name, "使用を終了しました");
  } catch (error) {
    alert("使用終了に失敗しました。もう一度試してください。");
    console.error(error);
  } finally {
    busy = false;
    render();
  }
}

myNameEl.addEventListener("change", () => {
  localStorage.setItem("sharedAccountMyName", myNameEl.value);
});

document.getElementById("clearHistory").addEventListener("click", async () => {
  if (!ready || busy) return;
  if (!confirm("全員の履歴を削除しますか？")) return;

  busy = true;
  render();

  try {
    await update(statusRef, { activity: [] });
  } catch (error) {
    alert("履歴を削除できませんでした。");
    console.error(error);
  } finally {
    busy = false;
    render();
  }
});

const savedName = localStorage.getItem("sharedAccountMyName");
if (names.includes(savedName)) {
  myNameEl.value = savedName;
}

async function startApp() {
  try {
    await signInAnonymously(auth);

    // 初回のみ初期データを作成
    const snapshot = await get(statusRef);
    if (!snapshot.exists()) {
      await set(statusRef, {
        activeUser: null,
        users: {
          "なーな": { request: false, using: false, startedAt: null },
          "らび": { request: false, using: false, startedAt: null },
          "みかてぃ": { request: false, using: false, startedAt: null }
        },
        activity: []
      });
    }

    onValue(statusRef, (snapshot) => {
      const value = snapshot.val() || {};
      data = {
        activeUser: value.activeUser || null,
        users: value.users || {},
        activity: Array.isArray(value.activity)
          ? value.activity
          : []
      };

      for (const name of names) {
        if (!data.users[name]) {
          data.users[name] = {
            request: false,
            using: false,
            startedAt: null
          };
        }
      }

      ready = true;
      connectionEl.textContent = "🟢 接続済み・共有中";
      render();
    }, (error) => {
      connectionEl.textContent = "🔴 データの読み込みに失敗しました";
      console.error(error);
    });
  } catch (error) {
    connectionEl.textContent =
      "🔴 接続失敗：Firebaseの設定・認証・ルールを確認してください";
    console.error(error);
  }
}

render();
startApp();
</script>
</body>
</html>
